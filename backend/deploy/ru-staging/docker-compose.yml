name: w1zzydev-ru-staging

services:
  ru-postgres:
    image: postgres:16.6-alpine
    user: "70:70"
    restart: unless-stopped
    environment:
      POSTGRES_DB: w1zzydev_ru_staging
      POSTGRES_USER: w1zzydev_ru_app
      POSTGRES_PASSWORD_FILE: /run/secrets/ru_postgres_password
      TZ: UTC
      PGTZ: UTC
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    secrets:
      - ru_postgres_password
    volumes:
      - ru_postgres_data:/var/lib/postgresql/data
    networks:
      - ru_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U w1zzydev_ru_app -d w1zzydev_ru_staging"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    command:
      - "postgres"
      - "-c"
      - "max_connections=40"
      - "-c"
      - "statement_timeout=5000"
      - "-c"
      - "idle_in_transaction_session_timeout=10000"
      - "-c"
      - "log_min_error_statement=error"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: &json_logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  migration:
    image: postgres:16.6-alpine
    depends_on:
      ru-postgres:
        condition: service_healthy
    networks:
      - ru_internal
    secrets:
      - ru_postgres_password
    volumes:
      - ../../database/migrations:/migrations:ro
      - ./scripts:/deploy-scripts:ro
    entrypoint: ["/bin/sh", "/deploy-scripts/run-migrations.sh"]
    environment:
      PGHOST: ru-postgres
      PGPORT: "5432"
      PGDATABASE: w1zzydev_ru_staging
      PGUSER: w1zzydev_ru_app
      PGPASSWORD_FILE: /run/secrets/ru_postgres_password
      DEPLOYMENT_REGION: RU
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *json_logs

  ru-backend:
    image: w1zzydev/backend-core:0.1.0-ru-staging
    build:
      context: ../..
      dockerfile: deploy/ru-staging/Dockerfile
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      DEPLOYMENT_REGION: RU
      LEAD_API_ENABLED: "true"
      NEW_BACKEND_ENABLED: "true"
      RU_DATABASE_MODE: postgres
      INTERNATIONAL_DATABASE_MODE: disabled
      STAGING_SYNTHETIC_DATA_ONLY: "true"
      PORT: "8787"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://ru-api-staging.example.com}
      FIELD_ENCRYPTION_MODE: ${FIELD_ENCRYPTION_MODE:-external_kms}
      PUBLIC_TOKEN_HASH_VERSION: ${PUBLIC_TOKEN_HASH_VERSION:-v1}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}
      DEPLOYMENT_VERSION: ${DEPLOYMENT_VERSION:-0.1.0-ru-staging}
    secrets:
      - ru_database_url
      - public_token_hash_secret
      - field_encryption_provider_config
    networks:
      - ru_internal
    expose:
      - "8787"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *json_logs

  reverse-proxy:
    image: nginx:1.27.3-alpine
    depends_on:
      ru-backend:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${RU_PROXY_HTTP_PORT:-8088}:80"
      - "${RU_PROXY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/tls:/etc/nginx/tls:ro
    networks:
      - ru_internal
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging: *json_logs

  backup:
    image: postgres:16.6-alpine
    profiles: ["backup"]
    depends_on:
      ru-postgres:
        condition: service_healthy
    networks:
      - ru_internal
    secrets:
      - ru_postgres_password
      - backup_encryption_secret
    volumes:
      - ./backup/out:/backup/out
      - ./backup:/backup/scripts:ro
    entrypoint: ["/bin/sh", "/backup/scripts/backup.sh"]
    environment:
      PGHOST: ru-postgres
      PGPORT: "5432"
      PGDATABASE: w1zzydev_ru_staging
      PGUSER: w1zzydev_ru_app
      PGPASSWORD_FILE: /run/secrets/ru_postgres_password
      BACKUP_RETENTION_DAYS: "14"
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *json_logs

networks:
  ru_internal:
    internal: true

volumes:
  ru_postgres_data:

secrets:
  ru_postgres_password:
    file: ./secrets/ru_postgres_password.txt
  ru_database_url:
    file: ./secrets/ru_database_url.txt
  public_token_hash_secret:
    file: ./secrets/public_token_hash_secret.txt
  field_encryption_provider_config:
    file: ./secrets/field_encryption_provider_config.json
  backup_encryption_secret:
    file: ./secrets/backup_encryption_secret.txt
