user nginx;
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format json_safe escape=json
    '{"timestamp":"$time_iso8601","level":"info","operation":"proxy.request","requestId":"$request_id","statusCode":$status,"durationBucket":"$request_time","region":"RU"}';

  access_log /var/log/nginx/access.log json_safe;
  error_log /var/log/nginx/error.log warn;

  limit_req_zone $binary_remote_addr zone=lead_api:10m rate=10r/m;
  client_max_body_size 32k;
  proxy_connect_timeout 3s;
  proxy_send_timeout 10s;
  proxy_read_timeout 10s;

  map $http_origin $cors_origin {
    default "";
    "~^https://ru-api-staging\\.example\\.com$" "$http_origin";
  }

  include /etc/nginx/conf.d/*.conf;
}
