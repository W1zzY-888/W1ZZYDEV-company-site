upstream ru_backend {
  server ru-backend:8787;
  keepalive 16;
}

server {
  listen 80;
  server_name ru-api-staging.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name ru-api-staging.example.com;

  ssl_certificate /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;
  ssl_session_timeout 10m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  if ($cors_origin != "") {
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
    add_header Access-Control-Allow-Headers "content-type,x-w1zzydev-request-id,x-w1zzydev-synthetic-test" always;
  }

  location = /health {
    proxy_set_header X-W1ZZYDEV-Request-Id $request_id;
    proxy_pass http://ru_backend;
  }

  location = /ready {
    proxy_set_header X-W1ZZYDEV-Request-Id $request_id;
    proxy_pass http://ru_backend;
  }

  location = /api/v1/leads {
    limit_req zone=lead_api burst=20 nodelay;
    proxy_set_header X-W1ZZYDEV-Request-Id $request_id;
    proxy_pass http://ru_backend;
  }

  location ~ ^/api/v1/leads/[^/]+$ {
    limit_req zone=lead_api burst=20 nodelay;
    proxy_set_header X-W1ZZYDEV-Request-Id $request_id;
    proxy_pass http://ru_backend;
  }

  location ~ ^/(debug|test|internal|api/v1/routing-preview) {
    return 404;
  }

  location / {
    return 404;
  }
}
